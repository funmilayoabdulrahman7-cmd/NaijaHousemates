<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote to Save - Naija Housemates</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0c10; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: screen;
        }
        
        .vote-card {
            background: #111827;
            border: 1px solid #1f2937;
            padding: 20px;
            border-radius: 16px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-top: 20px;
        }

        h1 { color: #f59e0b; font-size: 1.4rem; font-weight: 900; margin-bottom: 6px; }
        .subtitle { font-size: 12px; color: #9ca3af; uppercase; tracking-wider; margin-bottom: 20px; }
        
        .nominee-box {
            background: rgba(31, 41, 55, 0.5);
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border 0.2s;
        }
        .nominee-box:hover { border-color: #f59e0b; }
        
        .nominee-info { display: flex; items-center; gap: 12px; text-align: left; }
        .initials {
            width: 38px;
            height: 38px;
            background: #374151;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }
        
        .vote-btn {
            background: #f59e0b;
            color: black;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            active: scale-95;
        }
        .vote-btn:disabled {
            background: #4b5563;
            color: #9ca3af;
            cursor: not-allowed;
        }

        .share-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #1f2937;
        }
        .share-btn {
            background: #2563eb;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-top: 8px;
        }
        .vote-ticker { font-size: 11px; color: #10b981; font-weight: bold; margin-top: 4px; }
    </style>
</head>
<body>

    <div class="vote-card">
        <h1>👁️ NAIJA HOUSEMATES</h1>
        <p class="subtitle">🚨 WEEK 1 LIVE EVICTION VOTING</p>
        
        <p style="font-size: 13px; margin-bottom: 16px; color: #e5e7eb;">Select a housemate to <strong>SAVE</strong> from eviction. You have <span id="votes-left" style="color: #22d3ee; font-weight: bold;">1</span> free vote left today.</p>

        <!-- Nominees Container -->
        <div id="nominees-container">
            <!-- Nominee 1 -->
            <div class="nominee-box">
                <div class="nominee-info">
                    <div class="initials" style="background: #b45309; color: white;">C1</div>
                    <div>
                        <h4 style="font-weight: bold; font-size: 14px;">Chidi (You)</h4>
                        <p class="vote-ticker" id="votes-chidi">1,420 votes</p>
                    </div>
                </div>
                <button class="vote-btn" onclick="castVote('chidi')">VOTE</button>
            </div>

            <!-- Nominee 2 -->
            <div class="nominee-box">
                <div class="nominee-info">
                    <div class="initials">MG</div>
                    <div>
                        <h4 style="font-weight: bold; font-size: 14px;">Mama G (AI)</h4>
                        <p class="vote-ticker" id="votes-mamag">2,850 votes</p>
                    </div>
                </div>
                <button class="vote-btn" onclick="castVote('mamag')">VOTE</button>
            </div>

            <!-- Nominee 3 -->
            <div class="nominee-box">
                <div class="nominee-info">
                    <div class="initials">RK</div>
                    <div>
                        <h4 style="font-weight: bold; font-size: 14px;">Rich Kid (AI)</h4>
                        <p class="vote-ticker" id="votes-richkid">980 votes</p>
                    </div>
                </div>
                <button class="vote-btn" onclick="castVote('richkid')">VOTE</button>
            </div>
        </div>

        <!-- Viral Share Loop Component -->
        <div class="share-section">
            <p style="font-size: 12px; color: #9ca3af;">Want your person to survive? Campaign for them!</p>
            <button class="share-btn" onclick="copyCampaignText()">📋 Copy Viral Campaign Link</button>
        </div>
    </div>

    <script>
        let freeVotesLeft = 1;
        let votes = { chidi: 1420, mamag: 2850, richkid: 980 };

        function castVote(candidate) {
            if (freeVotesLeft <= 0) {
                alert("You have exhausted your free vote for today! Check back tomorrow.");
                return;
            }
            
            // Increment logic simulation
            votes[candidate]++;
            freeVotesLeft--;
            
            // UI Updates
            document.getElementById("votes-left").innerText = freeVotesLeft;
            document.getElementById(`votes-${candidate}`).innerText = `${votes[candidate].toLocaleString()} votes`;
            
            // Disable all buttons after voting
            const buttons = document.querySelectorAll('.vote-btn');
            buttons.forEach(btn => btn.disabled = true);
            
            alert(`🎉 Success! Your vote to SAVE ${candidate === 'chidi' ? 'Chidi' : candidate === 'mamag' ? 'Mama G' : 'Rich Kid'} has been recorded!`);
        }

        function copyCampaignText() {
            const textToCopy = "🚨 NAIJA HOUSEMATES EVICTION! Chidi is in danger of leaving Biggie's house this Sunday! Click here to cast your free vote to SAVE Chidi now: [://yourgamelink.com]";
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("🚀 Campaign message copied to your clipboard! Go paste it on WhatsApp, X (Twitter), or TikTok to pool votes!");
            }).catch(err => {
                alert("Oops, error copying link. Try manual selection!");
            });
        }
    </script>
</body>
</html>
