<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Naija Housemates</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#0a0b10;color:#fff;font-family:system-ui,sans-serif}
h1{font-size:1.2rem;text-align:center;margin:6px 0 12px}
.panel{background:#111827;border:1px solid #1f2a3d;border-radius:18px;padding:16px;margin-bottom:14px}
.label{font-size:.8rem;font-weight:700;color:#8b95a7;letter-spacing:.5px;margin:0 0 8px}
.stat{margin-bottom:10px}
.stat .top{display:flex;justify-content:space-between;font-weight:700;font-size:.85rem}
.track{height:12px;background:#1f2937;border-radius:8px;overflow:hidden;margin-top:4px}
.fill{height:100%;border-radius:8px;transition:width .4s;width:0}
#f-clout{background:#f59e0b}#f-stamina{background:#22d3ee}#f-paranoia{background:#e63946}#f-chores{background:#22c55e}
#elig{font-size:.8rem;text-align:center;margin-top:8px;color:#8b95a7;min-height:1em}
.note{background:#1f2937;border-radius:12px;padding:10px;text-align:center;font-size:.85rem;margin-bottom:12px}
.note a{color:#f59e0b;font-weight:700}
.hide{display:none}
.actions{display:flex;gap:8px}
.actions button{flex:1;padding:14px 4px;border:0;border-radius:12px;font-weight:700;font-size:.85rem;color:#fff}
#b-task{background:#1f2937}#b-arena{background:#d97706;color:#000}#b-diary{background:#3b1d6e}
.link-btn{display:block;margin-top:10px;padding:14px;border-radius:12px;color:#fff;text-align:center;font-weight:700;font-size:.95rem;text-decoration:none}
.join-btn{background:#f59e0b;color:#000}
.stand-btn{background:#22d3ee;color:#000}
.vote-btn{background:#e63946}
#feed{background:#08090d;border:1px solid #1f2a3d;border-radius:12px;padding:10px;height:190px;overflow-y:auto;font-family:monospace;color:#f59e0b;font-size:.85rem}
#feed div{padding:4px 0;border-bottom:1px solid #151823}
.chat{background:#1b2333;border-radius:18px;padding:14px}
.chat h2{margin:0 0 10px;font-size:1rem;color:#f59e0b}
#chat-container{background:#08090d;border-radius:12px;height:260px;overflow-y:auto;padding:10px;font-size:.9rem}
#chat-container div{padding:3px 0;word-break:break-word}
.who{color:#f59e0b;font-weight:700}
.send{display:flex;gap:8px;margin-top:10px}
.send input{flex:1;min-width:0;background:#08090d;color:#fff;border:1px solid #2a3550;border-radius:10px;padding:12px;font-size:1rem}
.send button{background:#f59e0b;color:#000;font-weight:700;border:0;border-radius:10px;padding:0 18px;font-size:1rem}
#name{width:100%;margin-bottom:8px;background:#08090d;color:#fff;border:1px solid #2a3550;border-radius:10px;padding:8px;font-size:.85rem}
#chat-status{font-size:.75rem;color:#8b95a7;margin-top:6px;min-height:1em}
</style>
</head>
<body>
<h1>🏠 NAIJA HOUSEMATES</h1>

<div class="note" id="login-note">🔐 <a href="/join">Log in</a> to save your clout and chores</div>

<div class="panel">
  <div class="stat"><div class="top"><span>👑 CLOUT</span><span id="v-clout">0 / 1000</span></div><div class="track"><div class="fill" id="f-clout"></div></div></div>
  <div class="stat"><div class="top"><span>⚡ STAMINA</span><span id="v-stamina">100%</span></div><div class="track"><div class="fill" id="f-stamina"></div></div></div>
  <div class="stat"><div class="top"><span>😰 PARANOIA</span><span id="v-paranoia">15%</span></div><div class="track"><div class="fill" id="f-paranoia"></div></div></div>
  <div class="stat"><div class="top"><span>🧹 CHORES THIS WEEK</span><span id="v-chores">0 / 5</span></div><div class="track"><div class="fill" id="f-chores"></div></div></div>
  <div id="elig"></div>
</div>

<div class="panel">
  <p class="label">HOUSE ACTIONS</p>
  <div class="actions">
    <button id="b-task">🧹<br>Daily Task</button>
    <button id="b-arena">🏆<br>Arena Game</button>
    <button id="b-diary">🚪<br>Diary Room</button>
  </div>
  <a class="link-btn join-btn" href="/join">🎤 Join the Auditions</a>
  <a class="link-btn stand-btn" href="/qualify">🏆 Audition Standings</a>
  <a class="link-btn vote-btn" href="/vote">🗳️ Fan Eviction Vote</a>
  <p class="label" style="margin-top:14px">LIVE HOUSE FEED</p>
  <div id="feed"></div>
</div>

<div class="panel chat">
  <h2>💬 GLOBAL FAN CHAT ROOM</h2>
  <input id="name" maxlength="20" placeholder="Your name">
  <div id="chat-container"></div>
  <div class="send">
    <input id="chat-input" maxlength="200" placeholder="Type message...">
    <button id="send-btn">Send</button>
  </div>
  <div id="chat-status"></div>
</div>

<script>
const SUB_URL = "https://agxbdnogjbzzgnnygrxy.supabase.co";
const SUB_KEY = "sb_publishable_0B5B_MC_7BIovYyDQXWXvw_2RaE77d5";
const BASE = { 'apikey': SUB_KEY, 'Content-Type': 'application/json' };
const HDR = { ...BASE, 'Authorization': `Bearer ${SUB_KEY}` };
const $ = id => document.getElementById(id);

// ---- Login session (shared with the Join page) ----
let session = null;
let busy = false;
function loadSession() {
  try { session = JSON.parse(localStorage.getItem('nh_session') || 'null'); } catch (e) { session = null; }
}
function saveSession(s) {
  session = s;
  try { s ? localStorage.setItem('nh_session', JSON.stringify(s)) : localStorage.removeItem('nh_session'); } catch (e) {}
}
function toSession(d, email) {
  return {
    access_token: d.access_token,
    refresh_token: d.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (d.expires_in || 3600),
    email: (d.user && d.user.email) || email
  };
}
async function ensureFresh() {
  if (!session) return false;
  if (session.expires_at - 60 > Date.now() / 1000) return true;
  try {
    const r = await fetch(SUB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: BASE, body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const d = await r.json();
    if (r.ok && d.access_token) { saveSession(toSession(d, session.email)); return true; }
  } catch (e) {}
  saveSession(null);
  return false;
}
async function rpc(name, body) {
  const r = await fetch(`${SUB_URL}/rest/v1/rpc/${name}`, {
    method: 'POST',
    headers: { ...BASE, 'Authorization': 'Bearer ' + session.access_token },
    body: JSON.stringify(body || {})
  });
  if (r.status === 401) { saveSession(null); throw new Error('login'); }
  return r.json();
}

// ---- Live house feed (AI events from the server + your own actions) ----
let events = [];
let mine = [{ t: 0, text: '[BIGGIE]: Welcome to the house. No loose guarding o!' }];
function renderFeed() {
  const all = events
    .map(e => ({ t: e.t, text: '[' + String(e.ai).toUpperCase() + ']: ' + e.body }))
    .concat(mine)
    .sort((a, b) => a.t - b.t)
    .slice(-40);
  const box = $('feed');
  box.innerHTML = '';
  all.forEach(x => {
    const d = document.createElement('div');
    d.textContent = x.text;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;
}
function feed(text) {
  mine.push({ t: Date.now(), text: text });
  renderFeed();
}
async function loadEvents() {
  try {
    const r = await fetch(`${SUB_URL}/rest/v1/rpc/house_feed`, { method: 'POST', headers: HDR, body: '{}' });
    const d = await r.json();
    if (Array.isArray(d)) {
      events = d.map(x => ({ t: Date.parse(x.ev_at), ai: x.ev_ai, body: x.ev_body }));
      renderFeed();
    }
  } catch (e) {}
}

// ---- Game stats (saved on the server) ----
function renderStats(s) {
  s = s || { clout: 0, stamina: 100, paranoia: 15, chores: 0 };
  $('v-clout').textContent = s.clout + ' / 1000';
  $('v-stamina').textContent = s.stamina + '%';
  $('v-paranoia').textContent = s.paranoia + '%';
  $('v-chores').textContent = s.chores + ' / 5';
  $('f-clout').style.width = Math.min(100, s.clout / 10) + '%';
  $('f-stamina').style.width = s.stamina + '%';
  $('f-paranoia').style.width = s.paranoia + '%';
  $('f-chores').style.width = Math.min(100, s.chores * 20) + '%';
  const ok = s.clout >= 1000 && s.chores >= 5;
  $('elig').textContent = !session ? '' :
    ok ? "✅ You're eligible for this week's auditions!" :
    'Need 1,000 clout and 5 daily chores this week to qualify';
}
async function refreshStats() {
  const ok = await ensureFresh();
  $('login-note').className = ok ? 'note hide' : 'note';
  if (!ok) { renderStats(null); return; }
  try {
    const s = await rpc('get_stats');
    if (s && !s.error) renderStats(s);
  } catch (e) {
    $('login-note').className = 'note';
    renderStats(null);
  }
}
async function doAct(act) {
  if (busy) return;
  if (!(await ensureFresh())) {
    feed('[BIGGIE]: Log in first to play. Tap Join the Auditions.');
    refreshStats();
    return;
  }
  busy = true;
  try {
    const r = await rpc('do_action', { act: act });
    if (r.error === 'cooldown') feed('[BIGGIE]: Easy o! Wait ' + r.wait + 's.');
    else if (r.error === 'no_stamina') feed('[BIGGIE]: You too tire. Rest small!');
    else if (r.error) feed('[BIGGIE]: Something went wrong (' + r.error + ').');
    else { feed('[BIGGIE]: ' + r.msg); renderStats(r); }
  } catch (e) {
    feed('[BIGGIE]: Network wahala. Try again.');
  }
  busy = false;
}
$('b-task').onclick = () => doAct('task');
$('b-arena').onclick = () => doAct('arena');
$('b-diary').onclick = () => doAct('diary');

// ---- Global fan chat (Supabase) ----
try { $('name').value = localStorage.getItem('nh_name') || ''; } catch (e) {}

async function fetchChatMessages() {
  try {
    const r = await fetch(
      `${SUB_URL}/rest/v1/house_chats?select=sender,message&order=created_at.desc&limit=20`,
      { headers: HDR }
    );
    const data = await r.json();
    if (!Array.isArray(data)) {
      $('chat-status').textContent = 'Load error: ' + (data.message || r.status);
      return;
    }
    const box = $('chat-container');
    box.innerHTML = '';
    data.reverse().forEach(m => {
      const row = document.createElement('div');
      const who = document.createElement('span');
      who.className = 'who';
      who.textContent = m.sender + ': ';
      row.appendChild(who);
      row.appendChild(document.createTextNode(m.message));
      box.appendChild(row);
    });
    box.scrollTop = box.scrollHeight;
    $('chat-status').textContent = 'Live • connected';
  } catch (e) {
    $('chat-status').textContent = 'Cannot reach Supabase: ' + e.message;
  }
}

async function sendChatMessage() {
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;
  const name = $('name').value.trim() || 'Fan';
  try { localStorage.setItem('nh_name', name); } catch (e) {}
  $('send-btn').disabled = true;
  try {
    const r = await fetch(`${SUB_URL}/rest/v1/house_chats`, {
      method: 'POST',
      headers: { ...HDR, 'Prefer': 'return=minimal' },
      body: JSON.stringify({ sender: name, message: text })
    });
    if (!r.ok) {
      alert('Send failed ' + r.status + ': ' + await r.text());
    } else {
      input.value = '';
      fetchChatMessages();
    }
  } catch (e) {
    alert('Cannot reach Supabase: ' + e.message);
  }
  $('send-btn').disabled = false;
}

$('send-btn').onclick = sendChatMessage;
$('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChatMessage(); });

loadSession();
renderStats(null);
renderFeed();
loadEvents();
setInterval(loadEvents, 30000);
refreshStats();
setInterval(refreshStats, 30000);
fetchChatMessages();
setInterval(fetchChatMessages, 5000);
</script>
</body>
</html>
