<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naija Housemates Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0c10; color: #f3f4f6; font-family: system-ui, sans-serif; padding: 10px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #111827; border-radius: 8px; margin-bottom: 12px; }
        header h1 { color: #f59e0b; font-size: 1.2rem; font-weight: 900; }
        .live-tag { background-color: rgba(220, 38, 38, 0.2); color: #f87171; border: 1px solid rgba(220, 38, 38, 0.4); padding: 4px 8px; font-size: 11px; font-weight: bold; border-radius: 4px; }
        main { display: flex; flex-direction: column; gap: 12px; }
        section { background: #111827; border: 1px solid #1f2937; padding: 16px; border-radius: 12px; }
        .profile-row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .avatar { width: 44px; height: 44px; background: #f59e0b; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .stat-group { margin-bottom: 12px; }
        .stat-header { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; font-weight: bold;}
        .stat-bar-bg { width: 100%; background: #374151; height: 8px; border-radius: 4px; overflow: hidden;}
        .stat-bar-fill { height: 100%; transition: width 0.3s ease; }
        .c-clout { color: #f59e0b; } .bg-clout { background: #f59e0b; }
        .c-stamina { color: #22d3ee; } .bg-stamina { background: #22d3ee; }
        .c-paranoia { color: #c084fc; } .bg-paranoia { background: #c084fc; }
        .actions-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px;}
        .btn { background: #1f2937; border: 1px solid #374151; color: white; padding: 12px 4px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: bold; cursor: pointer; }
        .btn-arena { background: #d97706; color: #000; border: none; }
        .btn-diary { background: rgba(88, 28, 135, 0.6); border: 1px solid rgba(147, 51, 234, 0.4); }
        .feed-box { height: 180px; display: flex; flex-direction: column; margin-top: 12px;}
        .feed-container { background: #0b0c10; border: 1px solid #1f2937; padding: 10px; border-radius: 8px; overflow-y: auto; font-family: monospace; font-size: 12px; height: 140px; }
        .feed-line { padding: 4px 0; border-bottom: 1px solid rgba(31, 41, 55, 0.3); }
        
        /* 💬 New Global Live Chat Component Interface */
        .chat-box { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 12px; margin-top: 12px; display: flex; flex-direction: column; height: 260px; }
        .chat-messages { flex: 1; background: #0b0c10; border-radius: 8px; padding: 8px; overflow-y: auto; font-size: 12px; margin-bottom: 8px; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { background: #0b0c10; border: 1px solid #4b5563; color: white; padding: 8px; border-radius: 6px; flex: 1; font-size: 12px; }
        .btn-send { background: #f59e0b; color: black; border: none; padding: 0 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1>👁️ NAIJA HOUSEMATES</h1>
        <div class="live-tag">🔴 SEASON 1 LIVE</div>
    </header>

    <main>
        <section>
            <div class="profile-row">
                <div class="avatar">C1</div>
                <div>
                    <h3 style="font-weight: bold;">Chidi (Cruise Master)</h3>
                    <p style="font-size: 11px; color: #9ca3af;">Status: <span style="color: #4ade80; font-weight: bold;">Active</span></p>
                </div>
            </div>
            <div class="stat-group">
                <div class="stat-header"><span class="c-clout">🔥 CLOUT</span><span id="stat-clout">500</span></div>
                <div class="stat-bar-bg"><div id="bar-clout" class="stat-bar-fill bg-clout" style="width: 50%;"></div></div>
            </div>
            <div class="stat-group">
                <div class="stat-header"><span class="c-stamina">⚡ STAMINA</span><span id="stat-stamina">100%</span></div>
                <div class="stat-bar-bg"><div id="bar-stamina" class="stat-bar-fill bg-stamina" style="width: 100%;"></div></div>
            </div>
        </section>

        <section>
            <h4 style="font-size: 11px; color: #9ca3af; text-transform: uppercase;">House Actions</h4>
            <div class="actions-grid">
                <div class="btn" onclick="handleAction('task')"><span>🧹</span><p>Daily Task</p></div>
                <div class="btn btn-arena" onclick="handleAction('arena')"><span>🏆</span><p>Arena Game</p></div>
                <div class="btn btn-diary" onclick="handleAction('diary')"><span>🚪</span><p>Diary Room</p></div>
            </div>

            <div class="feed-box">
                <h4 style="font-size: 11px; color: #9ca3af; text-transform: uppercase; margin-bottom: 6px;">Live House Feed</h4>
                <div id="feed-container" class="feed-container">
                    <div class="feed-line" style="color: #f59e0b; font-weight: bold;">[BIGGIE]: Welcome to the house. No loose guarding o!</div>
                </div>
            </div>

            <!-- 💬 Live Multiplayer Chat Box Panel Layout -->
            <div class="chat-box">
                <h4 style="font-size: 11px; color: #f59e0b; text-transform: uppercase; margin-bottom: 4px;">💬 Global Fan Chat Room</h4>
                <div id="chat-container" class="chat-messages"></div>
                <div class="chat-input-row">
                    <input id="chat-msg-input" type="text" placeholder="Type your banter here...">
                    <button class="btn-send" onclick="sendGlobalMessage()">Send</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        let clout = 500; let stamina = 100; let paranoia = 15;
        
        // 🔑 Hooked directly to your specific live database credentials
        const SUB_URL = "https://supabase.co";
        const SUB_KEY = "sb_publishable_0B5B_MC_7BIovYyDQXWXvw_2RaE77d5";

        document.addEventListener("DOMContentLoaded", () => {
            fetchChatMessages();
            setInterval(fetchChatMessages, 3000); // Poll fresh updates from cloud every 3 seconds
        });

        async function fetchChatMessages() {
            try {
                const response = await fetch(`${SUB_URL}/rest/v1/house_chats?order=created_at.desc&limit=15`, {
                    headers: { 'apikey': SUB_KEY, 'Authorization': `Bearer ${SUB_KEY}` }
                });
                const data = await response.json();
                const container = document.getElementById("chat-container");
                container.innerHTML = "";
                data.reverse().forEach(msg => {
                    container.innerHTML += `<div style="padding:3px 0;"><strong style="color:#f59e0b;">${msg.sender}:</strong> ${msg.message}</div>`;
                });
                container.scrollTop = container.scrollHeight;
            } catch(e) { console.log("Chat sync timeout"); }
        }

        async function sendGlobalMessage() {
            const input = document.getElementById("chat-msg-input");
            const text = input.value.trim();
            if(!text) return;

            try {
                await fetch(`${SUB_URL}/rest/v1/house_chats`, {
                    method: 'POST',
                    headers: { 'apikey': SUB_KEY, 'Authorization': `Bearer ${SUB_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
                    body: JSON.stringify({ sender: 'Chidi', message: text })
                });
                input.value = "";
                fetchChatMessages();
            } catch(e) { alert("Message failed to send o!"); }
        }

        function updateUI() {
            document.getElementById("stat-clout").innerText = clout;
            document.getElementById("bar-clout").style.width = `${Math.min(clout / 10, 100)}%`;
            document.getElementById("stat-stamina").innerText = `${stamina}%`;
            document.getElementById("bar-stamina").style.width = `${stamina}%`;
        }

        function handleAction(type) {
            if (stamina <= 0 && type !== 'diary') { logMessage("❌ SYSTEM", "You are completely exhausted!", "#f87171"); return; }
            if(type === 'task') { stamina -= 20; clout += 45; logMessage("🧠 YOU", "You cleaned the lounge. (+45 Clout)", "#22d3ee"); }
            if(type === 'arena') { stamina -= 35; clout += 100; logMessage("🎉 ARENA", "You won the minigame! (+100 Clout)", "#f59e0b"); }
            if(type === 'diary') { logMessage("👁️ BIGGIE", '"The viewers are watching you."', "#c084fc"); }
            updateUI();
        }

        function logMessage(sender, text, color = "#d1d5db") {
            const feed = document.getElementById("feed-container");
            feed.innerHTML += `<div class="feed-line" style="color:${color}"><span style="opacity:0.6;">[${sender}]:</span> ${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }
    </script>
</body>
</html>
